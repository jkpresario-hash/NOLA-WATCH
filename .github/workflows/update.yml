name: Update NOLA WATCH

on:
  push:
    branches: [main]
    paths:
      - 'collect.py'
      - 'news_policy.py'
      - 'news_sources.json'
      - 'index.html'
      - 'feed.js'
      - 'assets/**'
      - 'social_collect.py'
      - 'social_sources.json'
      - 'article_collect.py'
      - 'article_sources.json'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/update.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 0,9 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nola-watch-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check whether feed collection is needed
        id: collection
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          collect=true
          if [[ "$EVENT_NAME" == push ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            if git diff --name-only "$BEFORE_SHA" HEAD > "$RUNNER_TEMP/nola-changed-files"; then
              if ! grep -qEv '^(index\.html|feed\.js|assets/.*|\.github/workflows/update\.yml)$' "$RUNNER_TEMP/nola-changed-files"; then
                collect=false
              fi
            fi
          fi
          echo "run=$collect" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: .translation-cache.json
          key: translations-${{ github.run_id }}
          restore-keys: translations-

      - run: python -m unittest discover -s tests

      - run: node --test tests/feed.test.js

      - run: python collect.py
        if: steps.collection.outputs.run == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        timeout-minutes: 25

      - name: Save feed
        if: steps.collection.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          git diff --cached --quiet || git commit -m "Update Pelicans feed"
          git push

      - name: Prepare public files
        run: |
          mkdir -p public
          cp index.html feed.js data.json public/
          cp -R assets public/assets

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

