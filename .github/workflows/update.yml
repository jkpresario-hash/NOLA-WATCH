name: Update NOLA WATCH

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,9 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nola-watch-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: .translation-cache.json
          key: translations-${{ github.run_id }}
          restore-keys: translations-

      - run: python -m unittest discover -s tests

      - run: python collect.py
        timeout-minutes: 25

      - name: Save feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          git diff --cached --quiet || git commit -m "Update Pelicans feed"
          git push

      - name: Prepare public files
        run: |
          mkdir -p public
          cp index.html data.json public/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
